name: Deploy (example with secrets)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > kubeconfig
          mkdir -p $HOME/.kube
          mv kubeconfig $HOME/.kube/config

      - name: Create .env.secret
        run: |
          cat > .env.secret <<EOF
${{ secrets.ENV_FILE_CONTENT }}
EOF

      - name: Create k8s secret from env file
        run: |
          kubectl create namespace mbole-pay --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mbole-pay-secrets --from-env-file=.env.secret --namespace=mbole-pay --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade
        uses: azure/helm@v1
        with:
          args: upgrade --install mbole-pay ./helm/mbole-pay --namespace mbole-pay --create-namespace

    env:
      # Expected: Add these as repository secrets
      # KUBE_CONFIG_DATA: base64-encoded kubeconfig
      # ENV_FILE_CONTENT: the full .env.secret contents (multiline)
      # DATABASE_URL, NEXTAUTH_SECRET are also available as secrets if needed
      