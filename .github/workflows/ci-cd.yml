name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.5"

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbole_pay

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --runInBand

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbole_pay
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    # Run on PRs and pushes to catch chart issues early
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update helm repos
        run: helm repo update

      - name: Lint Helm chart
        run: |
          helm lint ./helm/mbole-pay


  docker-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Deploy with Helm
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          FAPSHI_API_KEY: ${{ secrets.FAPSHI_API_KEY }}
          FAPSHI_WEBHOOK_SECRET: ${{ secrets.FAPSHI_WEBHOOK_SECRET }}
        run: |
          helm upgrade --install mbole-pay ./helm/mbole-pay \
            --namespace mbole-pay \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ github.sha }} \
            --set-string secrets.DATABASE_URL="$DATABASE_URL" \
            --set-string secrets.NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            --set-string secrets.EMAIL_USER="$EMAIL_USER" \
            --set-string secrets.EMAIL_PASSWORD="$EMAIL_PASSWORD" \
            --set-string secrets.FAPSHI_API_KEY="$FAPSHI_API_KEY" \
            --set-string secrets.FAPSHI_WEBHOOK_SECRET="$FAPSHI_WEBHOOK_SECRET" \
            --wait --timeout 10m --atomic