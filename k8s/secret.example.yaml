apiVersion: v1
kind: Secret
metadata:
  name: mbole-pay-secrets
  namespace: mbole-pay
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@POSTGRES_HOST:5432/mbole_pay?schema=public"
  NEXTAUTH_SECRET: "replace-with-a-long-random-string"
  EMAIL_USER: "your-email@gmail.com"
  EMAIL_PASSWORD: "your-app-password"
  EMAIL_FROM: "noreply@mbolepay.com"
  FAPSHI_API_KEY: "your-fapshi-api-key-here"
  FAPSHI_WEBHOOK_SECRET: "your-fapshi-webhook-secret-here"