apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mbole-pay-secrets
  namespace: mbole-pay
spec:
  encryptedData:
    # Replace the values below with the base64-encrypted fields produced by `kubeseal`.
    # Example keys that your app expects (based on .env.example):
    DATABASE_URL: <sealed-AES256-base64>
    NEXTAUTH_SECRET: <sealed-AES256-base64>
    EMAIL_PASSWORD: <sealed-AES256-base64>
  template:
    metadata:
      name: mbole-pay-secrets
      namespace: mbole-pay

# To generate a SealedSecret, install kubeseal and run:
# kubectl create secret generic mbole-pay-secrets --from-literal=NEXTAUTH_SECRET='s3cret' --dry-run=client -o yaml > secret.yaml
# kubeseal --format yaml < secret.yaml > sealed-secret.yaml
# Then commit sealed-secret.yaml (it is safe to store in git)
