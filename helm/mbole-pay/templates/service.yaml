apiVersion: v1
kind: Service
metadata:
  name: {{ include "mbole-pay.fullname" . }}
  labels:
    {{- include "mbole-pay.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "mbole-pay.name" . }}
    release: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
