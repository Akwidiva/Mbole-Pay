
<style>
  .wrap { font-family: var(--font-sans); padding: 16px 0 8px; }
  svg text { font-family: var(--font-sans); }
</style>
<div class="wrap">
<svg width="100%" viewBox="0 0 680 620">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Actor boxes -->
<!-- User x=60, Web App x=200, Backend x=360, Smart Contract x=500, Recipient x=630 (use 620) -->

<!-- User -->
<g class="c-teal">
  <rect x="20" y="12" width="80" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="60" y="29" text-anchor="middle" dominant-baseline="central">User</text>
</g>

<!-- Web App -->
<g class="c-purple">
  <rect x="145" y="12" width="90" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="190" y="29" text-anchor="middle" dominant-baseline="central">Web App</text>
</g>

<!-- Backend -->
<g class="c-blue">
  <rect x="295" y="12" width="90" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="29" text-anchor="middle" dominant-baseline="central">Backend</text>
</g>

<!-- Smart Contract -->
<g class="c-coral">
  <rect x="435" y="12" width="110" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="490" y="29" text-anchor="middle" dominant-baseline="central">Smart Contract</text>
</g>

<!-- Recipient -->
<g class="c-amber">
  <rect x="605" y="12" width="70" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="640" y="29" text-anchor="middle" dominant-baseline="central">Recipient</text>
</g>

<!-- Lifelines -->
<line x1="60"  y1="46" x2="60"  y2="600" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="190" y1="46" x2="190" y2="600" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="340" y1="46" x2="340" y2="600" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="490" y1="46" x2="490" y2="600" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="640" y1="46" x2="640" y2="600" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 4"/>

<!-- === SECTION LABELS === -->
<text class="ts" x="8" y="88" fill="var(--color-text-tertiary)">Register</text>
<text class="ts" x="8" y="198" fill="var(--color-text-tertiary)">Contribute</text>
<text class="ts" x="8" y="338" fill="var(--color-text-tertiary)">Dispute</text>
<text class="ts" x="8" y="488" fill="var(--color-text-tertiary)">Payout</text>

<!-- Dividers -->
<line x1="0" y1="76" x2="680" y2="76" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="0" y1="186" x2="680" y2="186" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="0" y1="326" x2="680" y2="326" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<line x1="0" y1="476" x2="680" y2="476" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>

<!-- ===== 1. REGISTRATION (y 76-186) ===== -->
<!-- User → Web App: register() -->
<line x1="60" y1="100" x2="182" y2="100" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="121" y="96" text-anchor="middle" fill="var(--color-text-secondary)">register()</text>

<!-- Web App → Backend: validate + store user -->
<line x1="190" y1="118" x2="332" y2="118" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="261" y="114" text-anchor="middle" fill="var(--color-text-secondary)">validate &amp; store user</text>

<!-- Backend → Smart Contract: register on-chain -->
<line x1="340" y1="136" x2="482" y2="136" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="411" y="132" text-anchor="middle" fill="var(--color-text-secondary)">register on-chain</text>

<!-- Smart Contract → Backend: confirm (dashed) -->
<line x1="482" y1="154" x2="348" y2="154" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="415" y="150" text-anchor="middle" fill="var(--color-text-tertiary)">confirmed</text>

<!-- Backend → Web App → User: success -->
<line x1="332" y1="170" x2="198" y2="170" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="265" y="166" text-anchor="middle" fill="var(--color-text-tertiary)">success</text>
<line x1="182" y1="178" x2="68" y2="178" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="125" y="174" text-anchor="middle" fill="var(--color-text-tertiary)">welcome msg</text>


<!-- ===== 2. CONTRIBUTION (y 186-326) ===== -->
<!-- User → Web App: makeContribution() -->
<line x1="60" y1="210" x2="182" y2="210" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="121" y="206" text-anchor="middle" fill="var(--color-text-secondary)">makeContribution()</text>

<!-- Web App → Backend: process payment -->
<line x1="190" y1="228" x2="332" y2="228" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="261" y="224" text-anchor="middle" fill="var(--color-text-secondary)">process payment</text>

<!-- Backend → Smart Contract: recordContribution() -->
<line x1="340" y1="246" x2="482" y2="246" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="411" y="242" text-anchor="middle" fill="var(--color-text-secondary)">recordContribution()</text>

<!-- Smart Contract internally: schedulePayout() -->
<path d="M490 264 Q530 264 530 278 Q530 292 490 292" fill="none" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="548" y="282" text-anchor="start" fill="var(--color-text-secondary)">schedulePayout()</text>

<!-- Smart Contract → Backend → Web App: receipt -->
<line x1="482" y1="308" x2="348" y2="308" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="415" y="304" text-anchor="middle" fill="var(--color-text-tertiary)">receipt</text>
<line x1="332" y1="316" x2="198" y2="316" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="265" y="312" text-anchor="middle" fill="var(--color-text-tertiary)">notify user</text>


<!-- ===== 3. DISPUTE (y 326-476) ===== -->
<!-- User → Web App: raiseDispute() -->
<line x1="60" y1="350" x2="182" y2="350" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="121" y="346" text-anchor="middle" fill="var(--color-text-secondary)">raiseDispute()</text>

<!-- Web App → Backend: log dispute -->
<line x1="190" y1="368" x2="332" y2="368" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="261" y="364" text-anchor="middle" fill="var(--color-text-secondary)">log dispute</text>

<!-- User → Web App: vote() (dashed = async) -->
<line x1="60" y1="390" x2="182" y2="390" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="121" y="386" text-anchor="middle" fill="var(--color-text-tertiary)">vote()</text>

<!-- Web App → Backend: submit vote -->
<line x1="190" y1="408" x2="332" y2="408" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="261" y="404" text-anchor="middle" fill="var(--color-text-secondary)">submit vote</text>

<!-- Backend → Smart Contract: resolveDispute() -->
<line x1="340" y1="426" x2="482" y2="426" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="411" y="422" text-anchor="middle" fill="var(--color-text-secondary)">resolveDispute()</text>

<!-- Smart Contract internally: enforceRules() -->
<path d="M490 444 Q530 444 530 458 Q530 472 490 472" fill="none" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="548" y="462" text-anchor="start" fill="var(--color-text-secondary)">enforceRules()</text>


<!-- ===== 4. PAYOUT (y 476-600) ===== -->
<!-- Smart Contract → Backend: triggerPayout() -->
<line x1="482" y1="500" x2="348" y2="500" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="415" y="496" text-anchor="middle" fill="var(--color-text-secondary)">triggerPayout()</text>

<!-- Backend → Recipient: transfer funds -->
<line x1="340" y1="518" x2="632" y2="518" class="arr" stroke="var(--color-text-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="486" y="514" text-anchor="middle" fill="var(--color-text-secondary)">transfer funds</text>

<!-- Backend → Web App: notify -->
<line x1="332" y1="538" x2="198" y2="538" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="265" y="534" text-anchor="middle" fill="var(--color-text-tertiary)">payout sent</text>

<!-- Web App → User: notify -->
<line x1="182" y1="556" x2="68" y2="556" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="125" y="552" text-anchor="middle" fill="var(--color-text-tertiary)">SMS / email alert</text>

<!-- Recipient → Web App: acknowledge (dashed) -->
<line x1="632" y1="574" x2="198" y2="574" class="arr" stroke="var(--color-border-secondary)" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="415" y="570" text-anchor="middle" fill="var(--color-text-tertiary)">acknowledge receipt</text>

<!-- Legend -->
<line x1="20" y1="596" x2="50" y2="596" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="56" y="600" fill="var(--color-text-secondary)">synchronous</text>
<line x1="160" y1="596" x2="190" y2="596" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="600" fill="var(--color-text-tertiary)">async / response</text>
<path d="M310 596 Q330 596 330 590 Q330 584 310 584" fill="none" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="337" y="592" fill="var(--color-text-secondary)">self-call</text>

</svg>
